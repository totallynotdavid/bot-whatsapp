name: 👷 CI/CD (Bun)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.3"

    - uses: actions/setup-node@v4
      with:
        node-version: "24.21"

    - run: bun install --frozen-lockfile
    - run: bunx oxfmt --check src tests
    - run: bun run lint
    - run: bun run test
